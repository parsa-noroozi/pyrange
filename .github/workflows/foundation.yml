name: Foundation checks

on:
  push:
    branches: [main, fix/resource-naming]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-wheel:
    name: Unit and wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build tools
        run: python -m pip install ".[dev]" build
      - name: Record resolved dependencies
        run: python -m pip freeze
      - name: Run non-integration tests
        run: python -m pytest -m "not integration" -q --tb=short --junitxml=unit-results.xml
      - name: Reject missing or skipped tests
        run: python scripts/check_test_report.py unit-results.xml
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify wheel in a clean environment
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError(f'Expected one wheel, found {len(wheels)}')
          subprocess.run([sys.executable, 'scripts/verify_wheel.py', str(wheels[0])], check=True)
      - name: Save validation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: |
            unit-results.xml
            dist/*.whl
          if-no-files-found: warn

  docker-integration:
    name: Docker integration (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test tools
        run: python -m pip install ".[dev]"
      - name: Record resolved dependencies
        run: python -m pip freeze
      - name: Check Docker and prepare images
        run: |
          docker version
          docker info
          docker pull nginx:alpine
          docker pull alpine:latest
          docker image inspect nginx:alpine alpine:latest --format '{{.Id}} {{json .RepoDigests}}'
      - name: Run real Docker tests sequentially
        run: python -m pytest -m integration -v -s --tb=short -rs --junitxml=integration-results.xml
      - name: Reject missing or skipped integration tests
        run: python scripts/check_test_report.py integration-results.xml
      - name: Save integration report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-integration
          path: integration-results.xml
          if-no-files-found: warn
