name: basic-web-lab
description: Basic isolated web security laboratory

networks:
  - name: lab-net
    subnet: 172.28.10.0/24

machines:
  - name: web
    image: nginx:alpine
    interfaces:
      - network: lab-net
        ip: 172.28.10.10

  - name: analyst
    image: alpine:latest
    interfaces:
      - network: lab-net
        ip: 172.28.10.20
