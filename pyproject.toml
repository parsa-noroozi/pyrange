[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrange"
version = "0.6.0"
description = "A reproducible cybersecurity lab orchestration platform."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12"
]

[tool.setuptools.packages.find]
include = ["pyrange*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running Docker Engine",
]

[project.scripts]
pyrange = "pyrange.cli:app"
